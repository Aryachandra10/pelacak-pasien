<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jadwal Berobat Pasien</title>
</head>
<body>

  <!-- ====== JADWAL BEROBAT ====== -->
  <section class="schedule-section" aria-labelledby="scheduleTitle">
    <div class="schedule-head">
      <div class="schedule-head-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="3" ry="3"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8"  y1="2" x2="8"  y2="6"/>
          <line x1="3"  y1="10" x2="21" y2="10"/>
          <path d="M9 16l2 2 4-4"/>
        </svg>
      </div>
      <div class="schedule-head-text">
        <h3 id="scheduleTitle">Jadwal Berobat Pasien</h3>
        <p id="scheduleSubtitle">Tidak ada jadwal dalam waktu dekat.</p>
      </div>
      <button type="button" class="schedule-add-mini" id="addScheduleBtn"
              aria-label="Tambah jadwal berobat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5"  y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>

    <ul id="scheduleList" class="schedule-list" aria-live="polite">
      <li class="schedule-empty">
        <div class="schedule-empty-icon" aria-hidden="true">📭</div>
        <div class="schedule-empty-text">
          <b>Belum ada jadwal berobat.</b>
          <span>Tekan tombol + untuk menambahkan jadwal pasien.</span>
        </div>
      </li>
    </ul>
  </section>
  <!-- ====== /JADWAL BEROBAT ====== -->


  <!-- ====== MODAL TAMBAH JADWAL ====== -->
  <div class="modal-overlay" id="scheduleModal" role="dialog"
       aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="modal-handle" aria-hidden="true"></div>
      <h3 id="modalTitle">Tambah Jadwal Berobat</h3>

      <div class="modal-body">
        <label for="schedName">Nama Pasien</label>
        <input type="text" id="schedName" placeholder="Contoh: Budi Santoso"
               autocomplete="name">

        <!-- ▼▼▼ NIK — HANYA ANGKA, MAX 16 DIGIT ▼▼▼ -->
        <label for="schedNIK">NIK (Nomor Induk Kependudukan)</label>
        <input type="text" id="schedNIK"
               placeholder="16 digit, contoh: 3171234567890001"
               autocomplete="off" inputmode="numeric"
               pattern="[0-9]*" maxlength="16">
        <!-- ▲▲▲ /NIK ▲▲▲ -->

        <!-- ▼▼▼ NOMOR WHATSAPP — HANYA ANGKA ▼▼▼ -->
        <label for="schedWA">Nomor WhatsApp</label>
        <input type="tel" id="schedWA"
               placeholder="Contoh: 081234567890"
               autocomplete="off" inputmode="numeric"
               pattern="[0-9]*" maxlength="16">
        <!-- ▲▲▲ /NOMOR WHATSAPP ▲▲▲ -->

        <!-- ▼▼▼ Tingkat Prioritas (sinkron dengan patient.html) ▼▼▼ -->
        <label for="schedPriority">Tingkat Prioritas</label>
        <select id="schedPriority" autocomplete="off">
          <option value="merah">President Suite</option>
          <option value="kuning">VVIP Suite</option>
          <option value="biru" selected>VVIP</option>
        </select>
        <!-- ▲▲▲ /Tingkat Prioritas ▲▲▲ -->

        <label for="schedDate">Tanggal Berobat</label>
        <input type="date" id="schedDate">

        <label for="schedTime">Jam</label>
        <input type="time" id="schedTime">

        <label for="schedPlace">Tempat / Poli</label>
        <input type="text" id="schedPlace"
               placeholder="Contoh: Poli Umum / RSUD Kota">

        <label for="schedNote">Catatan (opsional)</label>
        <textarea id="schedNote"
                  placeholder="Contoh: Bawa hasil lab, kontrol gula darah"></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="cancelSchedule">Batal</button>
        <button type="button" class="btn-save" id="saveSchedule">Simpan</button>
      </div>
    </div>
  </div>
  <!-- ====== /MODAL TAMBAH JADWAL ====== -->


  <script>
  /* =====================================================================
   *  Jadwal Berobat — Logic (tanpa CSS / self-contained)
   *  v7 — SYNC dengan index.html & patient.html:
   *       - Field `nik` (NIK 16 digit) — identik dengan sanitizeNIK() di index.html
   *       - Field `wa` (Nomor WhatsApp) — hanya angka
   *       - Field `priority` (merah|kuning|biru) — di-normalize oleh index.html
   *       - Migrasi otomatis data lama: `mr` → `nik`, `phone`/`hp` → `wa`
   *       - Data siap di-cross-reference dengan patientData[id].nik
   * ===================================================================== */
  (function () {
    'use strict';

    if (window.__JADWAL_BEROBAT_INIT__) return;
    window.__JADWAL_BEROBAT_INIT__ = true;

    var $ = function (id) { return document.getElementById(id); };

    /* -------------------------------------------------------------------
     * 0. UTIL — sanitasi NIK (hanya angka, max 16 digit)
     *    IDENTIK dengan sanitizeNIK() di index.html
     * ------------------------------------------------------------------- */
    function sanitizeNIK(v) {
      return String(v == null ? '' : v)
        .replace(/[^0-9]/g, '')
        .slice(0, 16);
    }

    /* -------------------------------------------------------------------
     * 0b. UTIL — sanitasi Nomor WhatsApp (hanya angka, max 16 digit)
     *     Contoh: "0812-3456-7890" → "081234567890"
     * ------------------------------------------------------------------- */
    function sanitizeWA(v) {
      return String(v == null ? '' : v)
        .replace(/[^0-9]/g, '')
        .slice(0, 16);
    }

    function bindNumericInput(el, sanitizer) {
      if (!el) return;

      /* Bersihkan tiap kali user mengetik */
      el.addEventListener('input', function () {
        var cleaned = sanitizer(el.value);
        if (el.value !== cleaned) el.value = cleaned;
      });

      /* Bersihkan saat paste */
      el.addEventListener('paste', function (e) {
        var cd = (e.clipboardData || window.clipboardData);
        if (!cd) return;
        var pasted = cd.getData('text') || '';
        if (/[^0-9]/.test(pasted)) {
          e.preventDefault();
          var cleaned = sanitizer(pasted);
          var start = el.selectionStart || 0;
          var end   = el.selectionEnd   || 0;
          var val   = el.value || '';
          var next  = val.slice(0, start) + cleaned + val.slice(end);
          el.value = sanitizer(next);
          var pos = Math.min(start + cleaned.length, 16);
          try { el.setSelectionRange(pos, pos); } catch (err) {}
          el.dispatchEvent(new Event('input', { bubbles: true }));
        }
      });

      /* Blokir tombol non-angka dari keyboard fisik */
      el.addEventListener('keypress', function (e) {
        if (e.key && e.key.length === 1 && !/[0-9]/.test(e.key)
            && !e.ctrlKey && !e.metaKey) {
          e.preventDefault();
        }
      });
    }

    /* -------------------------------------------------------------------
     * PRIORITY META — disamakan dengan TIERS di patient.html
     *   merah  → President Suite
     *   kuning → VVIP Suite
     *   biru   → VVIP  ← default
     * Alias lama (president/vvip-suite/vvip/hijau) tetap didukung.
     * ------------------------------------------------------------------- */
    var PRIORITY_META = {
      'merah':      { cls: 'president',  label: 'President Suite', key: 'merah'  },
      'kuning':     { cls: 'vvip-suite', label: 'VVIP Suite',      key: 'kuning' },
      'biru':       { cls: 'vvip',       label: 'VVIP',            key: 'biru'   },
      /* alias lama */
      'president':  { cls: 'president',  label: 'President Suite', key: 'merah'  },
      'vvip-suite': { cls: 'vvip-suite', label: 'VVIP Suite',      key: 'kuning' },
      'vvip':       { cls: 'vvip',       label: 'VVIP',            key: 'biru'   },
      'hijau':      { cls: 'vvip',       label: 'VVIP',            key: 'biru'   }
    };
    var DEFAULT_PRIORITY = 'biru';

    function getPriorityMeta(p) {
      return PRIORITY_META[p] || PRIORITY_META[DEFAULT_PRIORITY];
    }
    function guessPriority(name) {
      if (!name) return DEFAULT_PRIORITY;
      var n = String(name).toLowerCase();
      if (n.indexOf('president') >= 0) return 'merah';
      if (n.indexOf('vvip suite') >= 0 || n.indexOf('suite') >= 0) return 'kuning';
      return DEFAULT_PRIORITY;
    }
    function resolvePriority(item) {
      if (!item) return DEFAULT_PRIORITY;
      if (item.priority && PRIORITY_META[item.priority]) return item.priority;
      return guessPriority(item.name);
    }

    /* DOM */
    var STORAGE_KEY        = 'jadwal_berobat_pasien';
    var scheduleListEl     = $('scheduleList');
    var scheduleSubtitleEl = $('scheduleSubtitle');
    var modal              = $('scheduleModal');
    if (!scheduleListEl || !modal) return;

    /* Pasang filter angka ke input NIK & WhatsApp */
    var nikInputEl = $('schedNIK');
    var waInputEl  = $('schedWA');
    bindNumericInput(nikInputEl, sanitizeNIK);
    bindNumericInput(waInputEl,  sanitizeWA);

    /* Body lock */
    var lockCount = 0, savedOverflow = '';
    function lockBody()   { lockCount++; if (lockCount === 1) { savedOverflow = document.body.style.overflow || ''; document.body.style.overflow = 'hidden'; } }
    function unlockBody() { lockCount = Math.max(0, lockCount - 1); if (lockCount === 0) document.body.style.overflow = savedOverflow; }

    /* Storage — dengan migrasi mr → nik & phone/hp → wa otomatis */
    function getSchedules() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        var a = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(a)) return [];

        var needsSave = false;
        a.forEach(function (item) {
          if (!item || typeof item !== 'object') return;

          /* Migrasi data lama: field `mr` → `nik` */
          if (item.mr != null && item.nik == null) {
            item.nik = sanitizeNIK(item.mr);
            delete item.mr;
            needsSave = true;
          } else if (item.nik != null) {
            var cleanedNik = sanitizeNIK(item.nik);
            if (cleanedNik !== item.nik) { item.nik = cleanedNik; needsSave = true; }
          }

          /* Migrasi data lama: field `phone` / `hp` → `wa` */
          if (item.wa == null && (item.phone != null || item.hp != null)) {
            item.wa = sanitizeWA(item.phone != null ? item.phone : item.hp);
            delete item.phone; delete item.hp;
            needsSave = true;
          } else if (item.wa != null) {
            var cleanedWa = sanitizeWA(item.wa);
            if (cleanedWa !== item.wa) { item.wa = cleanedWa; needsSave = true; }
          }
        });
        if (needsSave) {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(a)); } catch (e) {}
        }
        return a;
      } catch (e) { return []; }
    }
    function saveSchedules(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
      catch (e) { console.warn('[jadwal_berobat] Gagal menyimpan:', e); }
    }

    /* Formatter */
    function formatTanggal(isoDate) {
      if (!isoDate) return '-';
      var d = new Date(isoDate + 'T00:00:00');
      if (isNaN(d.getTime())) return isoDate;
      var hari  = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
      var bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
      return hari[d.getDay()] + ', ' + d.getDate() + ' ' + bulan[d.getMonth()] + ' ' + d.getFullYear();
    }
    function getBadge(isoDate) {
      if (!isoDate) return { cls: 'badge-tanpa', text: 'Tanpa tanggal' };
      var today = new Date(); today.setHours(0,0,0,0);
      var target = new Date(isoDate + 'T00:00:00');
      var diff = Math.round((target - today) / 86400000);
      if (diff === 0) return { cls: 'badge-hari-ini',  text: 'Hari Ini' };
      if (diff === 1) return { cls: 'badge-besok',     text: 'Besok' };
      if (diff > 1)   return { cls: 'badge-mendatang', text: diff + ' hari lagi' };
      return { cls: 'badge-selesai', text: 'Selesai' };
    }
    function getInitials(name) {
      if (!name) return 'P';
      var parts = String(name).trim().split(/\s+/);
      return parts.length === 1
        ? parts[0].charAt(0).toUpperCase()
        : (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    }

    /* Format WA untuk tampilan & link wa.me */
    function formatWADisplay(wa) {
      if (!wa) return '-';
      var s = String(wa);
      /* 08xx-xxxx-xxxx */
      if (s.charAt(0) === '0') {
        return s.replace(/(\d{4})(?=\d)/g, '$1-');
      }
      return s;
    }
    function waLink(wa) {
      if (!wa) return '';
      var s = String(wa).replace(/[^0-9]/g, '');
      if (!s) return '';
      /* Normalisasi ke format internasional 62 */
      if (s.charAt(0) === '0') s = '62' + s.slice(1);
      else if (s.charAt(0) === '8') s = '62' + s;
      return 'https://wa.me/' + s;
    }

    /* Card builder */
    function buildScheduleCard(item, idx) {
      var badge = getBadge(item.date);
      var prio  = getPriorityMeta(resolvePriority(item));
      var nikVal = sanitizeNIK(item.nik);   /* ← pastikan angka murni untuk tampilan */
      var waVal  = sanitizeWA(item.wa);     /* ← pastikan angka murni untuk tampilan */

      var li = document.createElement('li');
      li.className = 'schedule-card priority-' + prio.cls;
      li.dataset.idx = String(idx);
      li.dataset.priority = prio.key;
      li.dataset.nik = nikVal;
      li.dataset.wa  = waVal;

      var head = document.createElement('div'); head.className = 'sc-head';

      var avatar = document.createElement('div');
      avatar.className = 'sc-avatar';
      avatar.textContent = getInitials(item.name);
      avatar.setAttribute('aria-hidden', 'true');

      var titleWrap = document.createElement('div'); titleWrap.className = 'sc-title-wrap';
      var title = document.createElement('div'); title.className = 'sc-name';
      title.textContent = item.name || 'Pasien';
      var sub = document.createElement('div'); sub.className = 'sc-sub';
      /* ✅ Tampilkan NIK (angka saja) + label prioritas */
      var nikText = nikVal ? ('NIK: ' + nikVal + ' • ') : '';
      sub.textContent = nikText + prio.label;
      titleWrap.appendChild(title); titleWrap.appendChild(sub);

      var badgeEl = document.createElement('span');
      badgeEl.className = 'sc-badge ' + badge.cls;
      badgeEl.textContent = badge.text;

      head.appendChild(avatar); head.appendChild(titleWrap); head.appendChild(badgeEl);

      var body = document.createElement('div'); body.className = 'sc-body';
      function makeInfo(iconKey, label, value, link) {
        var row = document.createElement('div'); row.className = 'sc-info';
        var ic = document.createElement('span'); ic.className = 'sc-ic ic-' + iconKey;
        ic.setAttribute('aria-hidden', 'true');
        var svg = '';
        switch (iconKey) {
          case 'id':    svg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2.5"/><line x1="14" y1="10" x2="19" y2="10"/><line x1="14" y1="14" x2="19" y2="14"/></svg>'; break;
          case 'wa':    svg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/><path d="M16 13.5c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.1s-.8.9-.9 1.1c-.2.2-.3.2-.6.1-.3-.2-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.4.1-.6.1-.1.3-.4.5-.6.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5 0-.1-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.2 3.4 5.3 4.7.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3z"/></svg>'; break;
          case 'date':  svg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'; break;
          case 'time':  svg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>'; break;
          case 'place': svg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'; break;
          case 'note':  svg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="14 3 14 9 20 9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>'; break;
        }
        ic.innerHTML = svg;

        var tx = document.createElement('div'); tx.className = 'sc-info-text';
        var lbl = document.createElement('span'); lbl.className = 'sc-lbl'; lbl.textContent = label;
        var val = document.createElement('span'); val.className = 'sc-val';
        if (link) {
          var a = document.createElement('a');
          a.href = link;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = value || '-';
          a.style.color = 'inherit';
          a.style.textDecoration = 'none';
          a.style.fontWeight = 'inherit';
          val.appendChild(a);
        } else {
          val.textContent = value || '-';
        }
        tx.appendChild(lbl); tx.appendChild(val);
        row.appendChild(ic); row.appendChild(tx);
        return row;
      }
      /* ✅ Baris NIK & WhatsApp di body kartu */
      body.appendChild(makeInfo('id',    'NIK',     nikVal || '-'));
      body.appendChild(makeInfo('wa',    'WhatsApp', formatWADisplay(waVal), waLink(waVal)));
      body.appendChild(makeInfo('date',  'Tanggal', formatTanggal(item.date)));
      body.appendChild(makeInfo('time',  'Jam',     item.time  || '-'));
      body.appendChild(makeInfo('place', 'Tempat',  item.place || '-'));
      if (item.note) body.appendChild(makeInfo('note', 'Catatan', item.note));

      var foot = document.createElement('div'); foot.className = 'sc-foot';

      /* Tombol WhatsApp (jika nomor ada) */
      if (waVal) {
        var waBtn = document.createElement('a');
        waBtn.className = 'sc-wa';
        waBtn.href = waLink(waVal);
        waBtn.target = '_blank';
        waBtn.rel = 'noopener noreferrer';
        waBtn.style.display = 'inline-flex';
        waBtn.style.alignItems = 'center';
        waBtn.style.gap = '6px';
        waBtn.style.marginRight = '8px';
        waBtn.style.textDecoration = 'none';
        waBtn.innerHTML =
          '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>' +
          '</svg><span>Chat WA</span>';
        foot.appendChild(waBtn);
      }

      var del = document.createElement('button');
      del.type = 'button'; del.className = 'sc-del';
      del.innerHTML = '<span>Hapus</span>';
      del.addEventListener('click', function (e) {
        e.stopPropagation();
        if (confirm('Hapus jadwal "' + (item.name || 'Pasien') + '"?')) {
          var arr = getSchedules(); arr.splice(idx, 1);
          saveSchedules(arr); renderSchedules();
        }
      });
      foot.appendChild(del);

      li.appendChild(head); li.appendChild(body); li.appendChild(foot);
      return li;
    }

    /* Render */
    function renderSchedules() {
      var data = getSchedules();
      data.sort(function (a, b) {
        return ((a.date || '') + ' ' + (a.time || ''))
             .localeCompare((b.date || '') + ' ' + (b.time || ''));
      });

      scheduleListEl.innerHTML = '';

      if (scheduleSubtitleEl) {
        var upcomingCount = 0;
        for (var u = 0; u < data.length; u++) {
          if (!data[u].date) continue;
          var t0 = new Date(); t0.setHours(0,0,0,0);
          var t1 = new Date(data[u].date + 'T00:00:00');
          if (isNaN(t1.getTime())) continue;
          var diff = Math.round((t1 - t0) / 86400000);
          if (diff >= 0 && diff <= 7) upcomingCount++;
        }
        if (data.length === 0)      scheduleSubtitleEl.textContent = 'Tidak ada jadwal dalam waktu dekat.';
        else if (upcomingCount > 0) scheduleSubtitleEl.textContent = upcomingCount + ' jadwal dalam 7 hari ke depan.';
        else                        scheduleSubtitleEl.textContent = data.length + ' jadwal tersimpan.';
      }

      if (!data.length) {
        var empty = document.createElement('li');
        empty.className = 'schedule-empty';
        empty.innerHTML =
          '<div class="schedule-empty-icon" aria-hidden="true">📭</div>' +
          '<div class="schedule-empty-text">' +
            '<b>Belum ada jadwal berobat.</b>' +
            '<span>Tekan tombol + untuk menambahkan jadwal pasien.</span>' +
          '</div>';
        scheduleListEl.appendChild(empty);
        return;
      }
      data.forEach(function (item, idx) {
        scheduleListEl.appendChild(buildScheduleCard(item, idx));
      });
    }

    /* Modal */
    var isOpen = false;
    function openModal() {
      if (isOpen) return;
      isOpen = true; lockBody(); modal.classList.add('show');
      try { history.pushState({ scheduleModal: true }, ''); } catch (e) {}
      setTimeout(function () { var f = $('schedName'); if (f) f.focus(); }, 350);
    }
    function closeModal() {
      if (!isOpen) return;
      isOpen = false; modal.classList.remove('show'); unlockBody();
    }
    window.addEventListener('popstate', function () { if (isOpen) closeModal(); });

    /* Events */
    var addBtn = $('addScheduleBtn');
    if (addBtn) addBtn.addEventListener('click', function () {
      var t = new Date();
      $('schedDate').value  = t.getFullYear() + '-' +
                              String(t.getMonth() + 1).padStart(2, '0') + '-' +
                              String(t.getDate()).padStart(2, '0');
      $('schedTime').value  = '09:00';
      $('schedName').value  = '';
      if (nikInputEl) nikInputEl.value = '';
      if (waInputEl)  waInputEl.value  = '';
      $('schedPlace').value = '';
      $('schedNote').value  = '';
      var prioEl = $('schedPriority');
      if (prioEl) prioEl.value = DEFAULT_PRIORITY;
      openModal();
    });

    var cancelBtn = $('cancelSchedule');
    if (cancelBtn) cancelBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && isOpen) closeModal(); });

    var saveBtn = $('saveSchedule');
    if (saveBtn) saveBtn.addEventListener('click', function () {
      var name  = $('schedName').value.trim();
      var nik   = sanitizeNIK(nikInputEl ? nikInputEl.value : '');
      var wa    = sanitizeWA(waInputEl ? waInputEl.value : '');
      if (nikInputEl && nikInputEl.value !== nik) nikInputEl.value = nik;
      if (waInputEl  && waInputEl.value  !== wa)  waInputEl.value  = wa;

      var date  = $('schedDate').value;
      var time  = $('schedTime').value;
      var place = $('schedPlace').value.trim();
      var note  = $('schedNote').value.trim();
      var prioEl = $('schedPriority');
      var priority = prioEl && prioEl.value ? prioEl.value : DEFAULT_PRIORITY;
      if (!PRIORITY_META[priority]) priority = DEFAULT_PRIORITY;

      if (!name)  { alert('Nama pasien wajib diisi.');     $('schedName').focus();  return; }
      if (!nik)   { alert('NIK wajib diisi (hanya angka).'); if (nikInputEl) nikInputEl.focus(); return; }
      if (nik.length !== 16) {
        var ok = confirm('NIK yang Anda masukkan ' + nik.length + ' digit.\n' +
                         'NIK standar Indonesia terdiri dari 16 digit.\n\n' +
                         'Tetap simpan dengan NIK ini?');
        if (!ok) { if (nikInputEl) nikInputEl.focus(); return; }
      }

      /* Validasi WhatsApp (opsional tapi kalau diisi harus wajar) */
      if (wa) {
        if (wa.length < 9 || wa.length > 15) {
          var okWa = confirm('Nomor WhatsApp yang Anda masukkan ' + wa.length + ' digit.\n' +
                             'Nomor Indonesia umumnya 10–13 digit (contoh: 081234567890).\n\n' +
                             'Tetap simpan dengan nomor ini?');
          if (!okWa) { if (waInputEl) waInputEl.focus(); return; }
        }
      }

      if (!date)  { alert('Tanggal berobat wajib diisi.'); $('schedDate').focus();  return; }
      if (!place) { alert('Tempat / poli wajib diisi.');   $('schedPlace').focus(); return; }

      var data = getSchedules();
      data.push({
        id: Date.now(),
        name: name,
        nik: nik,               /* ← NIK (16 digit, angka murni) */
        wa: wa,                 /* ← Nomor WhatsApp (angka murni) */
        priority: priority,     /* ← sinkron dengan patient.html (tierOf) */
        date: date,
        time: time,
        place: place,
        note: note
      });
      saveSchedules(data);
      renderSchedules();
      closeModal();
    });

    renderSchedules();

    window.__jadwalBerobat = {
      render: renderSchedules,
      open:   openModal,
      close:  closeModal,
      get:    getSchedules,
      priorityMeta: getPriorityMeta,
      resolvePriority: resolvePriority,
      DEFAULT_PRIORITY: DEFAULT_PRIORITY,
      sanitizeNIK: sanitizeNIK,
      sanitizeWA: sanitizeWA,
      STORAGE_KEY: STORAGE_KEY
    };
  })();
  </script>

</body>
</html>
