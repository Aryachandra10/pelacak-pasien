<!DOCTYPE html>
<!--
  ===================================================================
  index.html — Monitoring Pasien Prioritas — RS Pelabuhan Jakarta
  ===================================================================
  • Peta utama: Leaflet + tile Geoapify (dari config.php)
  • KLIK NAMA USER → MODAL PETA TERSENDIRI (per-user, TIDAK digabung)
  • IDENTITAS PASIEN: name + NIK (16 digit) + WA (nomor pasien)
  • TOMBOL WHATSAPP → LANGSUNG ke NOMOR PASIEN
    Nomor WA disinkronkan dari jadwal_berobat.html via NIK.
    Kalau pasien tidak punya WA, fallback ke nomor admin RS.
  • TOMBOL CHAT ADMIN → khusus untuk kirim ke admin RS (opsional).
  • FITUR HAPUS RIWAYAT: #clearHistoryBtn → hapus SEMUA riwayat
  • SYNC dengan jadwal_berobat.html:
      - Field `nik` (16 digit, angka murni)
      - Field `wa`  (nomor WhatsApp, angka murni, max 16 digit)
      - localStorage key: 'jadwal_berobat_pasien'
      - lookupWAFromJadwalByNIK() mencocokkan NIK → wa
      - lookupJadwalByNIK()      mencocokkan NIK → detail jadwal

  ⚠️  CSS sudah dipindahkan ke ../css/style.css.
      Tidak ada <style> inline di file ini.
  ===================================================================
-->

  <script>
    (function () {
      'use strict';

      var cfg    = window.CONFIG || {};
      var center = cfg.MAP_CENTER || { lat: -6.12504, lng: 106.91778 };
      var zoom   = cfg.MAP_ZOOM   || 13;

      var tileUrl = cfg.TILE_URL
        || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

      var tileAttr = cfg.TILE_ATTRIBUTION
        || '&copy; OpenStreetMap contributors &copy; Geoapify';

      window.__TILE_CFG__ = {
        url: tileUrl,
        attribution: tileAttr,
        maxZoom: 20
      };

      window.map = L.map('map', { zoomControl: false })
                    .setView([center.lat, center.lng], zoom);

      L.control.zoom({ position: 'bottomright' }).addTo(window.map);

      L.tileLayer(tileUrl, {
        maxZoom: 20,
        attribution: tileAttr
      }).addTo(window.map);

      var hosp = cfg.HOSPITAL;
      if (hosp && hosp.lat != null && hosp.lng != null) {
        L.marker([hosp.lat, hosp.lng], {
          icon: L.divIcon({
            className: '',
            html: '<div class="pin hosp">+</div>',
            iconSize: [34, 34],
            iconAnchor: [17, 17]
          })
        }).addTo(window.map).bindTooltip(hosp.name || 'Rumah Sakit');
      }

      console.info('[map] Provider:',
        tileUrl.indexOf('geoapify') !== -1 ? 'Geoapify' : 'OpenStreetMap');
    })();
  </script>
  <script>
    (function () {
      function bindLogout() {
        var logoutBtn = document.getElementById('logoutBtn');
        if (!logoutBtn) return;
        logoutBtn.addEventListener('click', async function () {
          if (!window.confirm('Keluar dari akun admin?')) return;
          logoutBtn.disabled = true;
          logoutBtn.textContent = 'Keluar...';
          try {
            var response = await fetch('../api/admin_auth.php?action=logout', {
              method: 'POST',
              credentials: 'same-origin',
              cache: 'no-store'
            });
            var data = await response.json();
            if (!response.ok || !data.ok) throw new Error('Logout gagal.');
            window.location.replace('login.html');
          } catch (error) {
            logoutBtn.disabled = false;
            logoutBtn.textContent = 'Logout';
            window.alert(error.message || 'Logout gagal. Silakan coba lagi.');
          }
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bindLogout, { once: true });
      } else {
        bindLogout();
      }
    })();
  </script>

  <!-- ============================================================
       LOGIKA APLIKASI
       ============================================================ -->
  <script>
    (function () {
      'use strict';

      /* =========================================================
         1. DETEKSI PLATFORM
         ========================================================= */
      var ua = navigator.userAgent || '';
      var platform = navigator.platform || '';
      var maxTouch = navigator.maxTouchPoints || 0;

      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                  (platform === 'MacIntel' && maxTouch > 1);
      var isAndroid = /Android/i.test(ua);

      var rootEl = document.documentElement;
      if (isIOS)          rootEl.classList.add('is-ios');
      else if (isAndroid) rootEl.classList.add('is-android');
      else                rootEl.classList.add('is-desktop');

      window.__PLATFORM__ = isIOS ? 'ios' : isAndroid ? 'android' : 'other';

      var $ = function (id) { return document.getElementById(id); };
      var side = $('sidePanel');

      /* =========================================================
         1b. UTIL NIK / WA / HTML
         ========================================================= */
      function sanitizeDigits(v, max) {
        var m = max || 16;
        return String(v == null ? '' : v)
          .replace(/[^0-9]/g, '')
          .slice(0, m);
      }
      function sanitizeNIK(v) { return sanitizeDigits(v, 16); }
      function sanitizeWA(v)  { return sanitizeDigits(v, 16); }

      /* Normalisasi ke format internasional (62…) untuk link wa.me */
      function normalizeWA(v) {
        var s = sanitizeWA(v);
        if (!s) return '';
        if (s.charAt(0) === '0') s = '62' + s.slice(1);
        else if (s.charAt(0) === '8') s = '62' + s;
        else if (s.indexOf('62') !== 0) s = '62' + s;
        return s;
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      /* Format tanggal Indonesia: "Senin, 12 Mei 2025" */
      function formatTanggalID(input) {
        if (!input) return '';
        try {
          var d = (input instanceof Date) ? input : new Date(input);
          if (isNaN(d.getTime())) return String(input);
          return d.toLocaleDateString('id-ID', {
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
          });
        } catch (e) {
          return String(input);
        }
      }

      /* Format jam: "14:30" */
      function formatJamID(input) {
        if (!input) return '';
        var s = String(input).trim();
        var m = s.match(/^(\d{1,2})[:.](\d{2})/);
        if (m) {
          return ('0' + m[1]).slice(-2) + ':' + m[2];
        }
        return s;
      }

      /* =========================================================
         1c. KONFIG WHATSAPP
         ========================================================= */
      var WA_CONFIG = (function () {
        var cfg = window.CONFIG || {};
        var adminNum = (cfg.WHATSAPP_ADMIN
                     || (cfg.HOSPITAL && (cfg.HOSPITAL.whatsapp || cfg.HOSPITAL.whatsappE164))
                     || '6281288357422'); /* nomor layanan RS Pelabuhan Jakarta */
        adminNum = normalizeWA(adminNum);

        return {
          adminNumber: adminNum,
          adminDisplay: '+' + adminNum,
          hospitalName: (cfg.HOSPITAL && cfg.HOSPITAL.name) || 'RS Pelabuhan Jakarta'
        };
      })();

      /* =========================================================
         1d. SINKRONISASI WA + JADWAL DARI jadwal_berobat.html
         ========================================================= */
      var JADWAL_STORAGE_KEY = 'jadwal_berobat_pasien';
      var jadwalByNIK = {};
      var jadwalDetailByNIK = {};
      var jadwalLastSnapshot = '';

      function rebuildJadwalCache() {
        jadwalByNIK = {};
        jadwalDetailByNIK = {};
        try {
          var raw = localStorage.getItem(JADWAL_STORAGE_KEY);
          if (!raw) return;
          var arr = JSON.parse(raw);
          if (!Array.isArray(arr)) return;
          arr.forEach(function (it) {
            if (!it) return;
            var nik = sanitizeNIK(it.nik);
            if (!nik) return;

            var wa = sanitizeWA(
              it.wa != null ? it.wa
              : it.phone != null ? it.phone
              : it.hp != null ? it.hp
              : ''
            );

            if (wa) {
              jadwalByNIK[nik] = wa;
            }

            var prev = jadwalDetailByNIK[nik];
            var curDate = it.date ? new Date(it.date).getTime() : 0;
            var prevDate = (prev && prev.date) ? new Date(prev.date).getTime() : 0;
            if (!prev || curDate >= prevDate) {
              jadwalDetailByNIK[nik] = {
                id: it.id || '',
                name: it.name || '',
                nik: nik,
                wa: wa,
                priority: it.priority || '',
                date: it.date || '',
                time: it.time || '',
                place: it.place || '',
                note: it.note || ''
              };
            }
          });
        } catch (e) {
          console.warn('[sync] gagal rebuild jadwal cache:', e);
        }
      }

      function lookupWAFromJadwalByNIK(nik) {
        var n = sanitizeNIK(nik);
        if (!n) return '';
        return jadwalByNIK[n] || '';
      }

      function lookupJadwalByNIK(nik) {
        var n = sanitizeNIK(nik);
        if (!n) return null;
        return jadwalDetailByNIK[n] || null;
      }

      function resolvePatientWA(patient) {
        if (!patient) return '';

        var direct = sanitizeWA(patient.wa);
        if (direct) return direct;

        var fromJadwal = lookupWAFromJadwalByNIK(patient.nik);
        if (fromJadwal) return fromJadwal;

        return sanitizeWA(
          patient.phone != null ? patient.phone
          : patient.hp != null ? patient.hp
          : ''
        );
      }

      function pickPatientWA(patient) {
        return resolvePatientWA(patient);
      }

      function hasPatientWA(patient) {
        return !!pickPatientWA(patient);
      }

      function refreshJadwalCacheIfChanged() {
        try {
          var raw = localStorage.getItem(JADWAL_STORAGE_KEY) || '';
          if (raw === jadwalLastSnapshot) return false;
          jadwalLastSnapshot = raw;
          rebuildJadwalCache();
          return true;
        } catch (e) {
          return false;
        }
      }

      function syncAllPatientWAB() {
        var changed = false;
        Object.keys(patientData).forEach(function (id) {
          var p = patientData[id];
          if (!p) return;
          var resolved = resolvePatientWA(p);
          if (resolved && resolved !== p.wa) {
            p.wa = resolved;
            changed = true;
            upsertPatientListItem(p);
            var m = window.patientMarkers[id];
            if (m) {
              try { m.setPopupContent(makePatientPopupHTML(p)); } catch (e) {}
            }
            if (userMapTarget && userMapTarget.id === id) {
              userMapTarget.wa = p.wa;
              updateUserMapLive();
            }
          }
        });
        return changed;
      }

      function buildWALink(patient, opts) {
        opts = opts || {};

        var raw = pickPatientWA(patient);
        var patientNum = raw ? normalizeWA(raw) : '';

        var toAdmin = !!opts.toAdmin;
        var target;

        if (toAdmin) {
          target = opts.target || WA_CONFIG.adminNumber;
        } else if (opts.target) {
          target = opts.target;
        } else if (patientNum) {
          target = patientNum;
        } else {
          target = WA_CONFIG.adminNumber;
        }

        var msg;
        if (toAdmin || !patientNum) {
          msg = buildWAMessageToAdmin(patient);
        } else {
          msg = buildWAMessageToPatient(patient);
        }

        return 'https://wa.me/' + target + '?text=' + encodeURIComponent(msg);
      }

      /* =========================================================
         TEMPLATE PESAN WHATSAPP — UNTUK PASIEN
         ========================================================= */
      function buildWAMessageToPatient(p) {
        var name = (p && p.name) ? String(p.name).trim() : 'Bapak/Ibu';
        var nik  = (p && p.nik)  ? sanitizeNIK(p.nik) : '';

        var jadwal = lookupJadwalByNIK(nik);

        var tanggalStr = jadwal && jadwal.date ? formatTanggalID(jadwal.date) : '';
        var jamStr     = jadwal && jadwal.time ? formatJamID(jadwal.time) : '';
        var tempatStr  = jadwal && jadwal.place ? String(jadwal.place).trim() : '';
        var catatanStr = jadwal && jadwal.note  ? String(jadwal.note).trim()  : '';

        var lines = [];

        lines.push('Halo Bapak/Ibu *' + name + '*,');
        if (nik) lines.push('NIK: ' + nik);
        lines.push('');
        lines.push('Kami dari *' + WA_CONFIG.hospitalName + '*');
        lines.push('Mengucapkan terima kasih telah mempercayakan layanan kesehatan Bapak/Ibu kepada kami.');
        lines.push('');
        lines.push('Melalui pesan ini, kami bermaksud mengingatkan kembali jadwal berobat Bapak/Ibu yang telah terdaftar di sistem kami:');

        if (tanggalStr || jamStr || tempatStr) {
          lines.push('');
          lines.push('*Rincian Jadwal:*');
          lines.push('• Tanggal : ' + (tanggalStr || '—'));
          lines.push('• Waktu   : ' + (jamStr ? jamStr + ' WIB' : '—'));
          lines.push('• Tempat  : ' + (tempatStr || '—'));
        } else {
          lines.push('');
          lines.push('_Mohon maaf, rincian jadwal Bapak/Ibu belum tersedia saat ini. Silakan hubungi petugas untuk informasi lebih lanjut._');
        }

        if (catatanStr) {
          lines.push('');
          lines.push('*Catatan Tambahan:*');
          lines.push('"' + catatanStr + '"');
        }

        lines.push('');
        lines.push('Untuk kenyamanan selama proses pelayanan, kami mohon Bapak/Ibu berkenan hadir *15 menit lebih awal* dengan membawa:');
        lines.push('1. Kartu identitas (KTP/SIM/Kartu Pasien)');
        lines.push('2. Kartu asuransi/BPJS Kesehatan (jika ada)');
        lines.push('3. Hasil pemeriksaan sebelumnya (jika diperlukan)');

        lines.push('');
        lines.push('Apabila Bapak/Ibu berhalangan hadir atau ingin menjadwalkan ulang, silakan hubungi Admin kami dengan klik tautan di bawah ini:');
        lines.push('https://wa.me/' + WA_CONFIG.adminNumber);
        lines.push('Kami siap membantu Bapak/Ibu.');

        lines.push('');
        lines.push('Demikian informasi yang dapat kami sampaikan. Terima kasih atas perhatian dan kerja sama Bapak/Ibu.');
        lines.push('');
        lines.push('Salam hangat,');
        lines.push('*Layanan Pasien Prioritas*');
        lines.push('_' + WA_CONFIG.hospitalName + '_');

        return lines.join('\n');
      }

      /* =========================================================
         TEMPLATE PESAN WHATSAPP — UNTUK ADMIN
         ========================================================= */
      function buildWAMessageToAdmin(p) {
        var name = (p && p.name) || 'Pasien';
        var nik  = (p && p.nik) ? sanitizeNIK(p.nik) : '-';
        var waRaw = pickPatientWA(p);
        var waNum = waRaw ? normalizeWA(waRaw) : '';
        var prioLabel = getPriorityMeta(normalizePriority(p && p.priority)).label;
        var lat  = p && p.lat != null ? Number(p.lat) : null;
        var lng  = p && p.lng != null ? Number(p.lng) : null;

        var jarakStr = '—', etaStr = '—';
        if (lat != null && lng != null && HOSPITAL_COORD) {
          var d = haversineMeters(lat, lng, HOSPITAL_COORD.lat, HOSPITAL_COORD.lng);
          jarakStr = fmtDistance(d);
          var spd = (p.speed != null && p.speed > 0.5) ? p.speed : 1.4;
          etaStr = fmtEta(d / spd);
        }

        var status = journeyStatus(p && p.speed, (lat != null && lng != null && HOSPITAL_COORD)
          ? haversineMeters(lat, lng, HOSPITAL_COORD.lat, HOSPITAL_COORD.lng)
          : null);

        var waktu = '';
        if (p && p.ts) {
          try { waktu = new Date(p.ts).toLocaleString('id-ID'); } catch (e) {}
        }

        var jadwal = lookupJadwalByNIK(nik);
        var jadwalLines = '';
        if (jadwal) {
          var tgl = jadwal.date ? formatTanggalID(jadwal.date) : '';
          var jam = jadwal.time ? formatJamID(jadwal.time) : '';
          var tpt = jadwal.place || '';
          if (tgl || jam || tpt) {
            jadwalLines = '\n*Jadwal* : ' +
              (tgl || '—') +
              (jam ? ', ' + jam + ' WIB' : '') +
              (tpt ? ' — ' + tpt : '');
          }
        }

        var lines = [];
        lines.push('*NOTIFIKASI PASIEN PRIORITAS*');
        lines.push('_' + WA_CONFIG.hospitalName + '_');
        lines.push('');
        lines.push('*Nama*    : ' + name);
        lines.push('*NIK*     : ' + (nik || '-'));
        if (waNum) lines.push('*No. WA*  : ' + waNum);
        lines.push('*Kelas*   : ' + prioLabel);
        if (jadwalLines) lines.push(jadwalLines.replace(/^\n/, ''));
        lines.push('');
        if (status && status.text) lines.push('*Status*  : ' + status.text);

        if (lat != null && lng != null) {
          lines.push('');
          lines.push('*Posisi saat ini*:');
          lines.push('https://maps.google.com/?q=' + lat + ',' + lng);
          lines.push('_(Lat ' + lat.toFixed(6) + ', Lng ' + lng.toFixed(6) + ')_');
        }

        lines.push('');
        lines.push('*Jarak ke RS* : ' + jarakStr);
        lines.push('*ETA*         : ' + etaStr);
        if (waktu) lines.push('*Update*      : ' + waktu);

        if (waNum) {
          lines.push('');
          lines.push('*Balas ke pasien*:');
          lines.push('https://wa.me/' + waNum);
        }

        lines.push('');
        lines.push('Mohon dipersiapkan penerimaannya di lobi / area terkait.');
        lines.push('');
        lines.push('_Pesan otomatis dari sistem Monitoring Pasien Prioritas._');

        return lines.join('\n');
      }

      /* =========================================================
         2. VIEWPORT FIX — Android
         ========================================================= */
      if (isAndroid) {
        var setVH = function () {
          document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');

      var lockCount = 0;

      function lockBody() {
        lockCount++;
        if (lockCount > 1) return;
        if (isIOS) {
          savedScrollY = window.scrollY || window.pageYOffset || 0;
          prevBodyStyle = {
            position: document.body.style.position,
            top: document.body.style.top,
            width: document.body.style.width,
            overflow: document.body.style.overflow
          };
          document.body.style.position = 'fixed';
          document.body.style.top = -savedScrollY + 'px';
          document.body.style.width = '100%';
          document.body.style.overflow = 'hidden';
        } else {

          document.body.style.overflow = 'hidden';
        }
      }
      function unlockBody() {
        lockCount = Math.max(0, lockCount - 1);
        if (lockCount > 0) return;
        if (isIOS) {
          document.body.style.position = prevBodyStyle.position || '';
          document.body.style.top = prevBodyStyle.top || '';
          document.body.style.width = prevBodyStyle.width || '';
          document.body.style.overflow = prevBodyStyle.overflow || '';
          window.scrollTo(0, savedScrollY);

      var HOSPITAL_COORD = null;
      (function () {
        var cfg = window.CONFIG || {};
        var h = cfg.HOSPITAL;
        if (h && h.lat != null && h.lng != null) {
          HOSPITAL_COORD = {
            lat: Number(h.lat),
            lng: Number(h.lng),
            name: h.name || 'RS Pelabuhan Jakarta'
          };

          };
        }
      })();

      function haversineMeters(lat1, lng1, lat2, lng2) {
        var R = 6371000, toRad = function (d) { return d * Math.PI / 180; };
        var dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
        var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
                Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*
                Math.sin(dLng/2)*Math.sin(dLng/2);
        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }
      function fmtDistance(m) {
        if (!isFinite(m)) return '—';
        if (m < 1000) return Math.round(m) + ' m';
        return (m / 1000).toFixed(2) + ' km';
      }
      function fmtEta(seconds) {
        if (!isFinite(seconds) || seconds <= 0) return '—';
        var m = Math.round(seconds / 60);
        if (m < 1) return '< 1 menit';
        if (m < 60) return m + ' menit';
        var h = Math.floor(m / 60), r = m % 60;
        return h + ' jam' + (r ? ' ' + r + ' menit' : '');
      }
      function journeyStatus(speed, distanceToHosp) {
        if (distanceToHosp != null && distanceToHosp < 60) {
          return { text: 'Sudah tiba di RS', color: '#16A34A' };
        }
        if (speed == null || !isFinite(speed)) return { text: 'Memantau…', color: '#1B5FAA' };
        if (speed < 0.5) return { text: 'Berhenti / diam', color: '#F59E0B' };
        if (speed < 1.4) return { text: 'Berjalan kaki', color: '#0EA5E9' };
        if (speed < 6)   return { text: 'Berkendara lambat', color: '#0EA5E9' };
        if (speed < 25)  return { text: 'Dalam perjalanan', color: '#16A34A' };
        return { text: 'Melaju cepat', color: '#16A34A' };
      }

      /* =========================================================
         6. ANIMASI MARKER
         ========================================================= */
      function animateMarkerTo(marker, newLat, newLng, durationMs, onDone) {
        if (!marker || typeof marker.getLatLng !== 'function') {
          if (typeof onDone === 'function') onDone();
          return;
        }
        var start    = marker.getLatLng();
        var startLat = start.lat, startLng = start.lng;
        var endLat   = Number(newLat), endLng = Number(newLng);
        if (isNaN(endLat) || isNaN(endLng)) {
          if (typeof onDone === 'function') onDone();
          return;
        }
        var dist = Math.hypot(endLat - startLat, endLng - startLng);
        if (dist < 1e-5) {
          marker.setLatLng([endLat, endLng]);
          if (typeof onDone === 'function') onDone();
          return;
        }
        var dur = typeof durationMs === 'number' ? durationMs : 900;
        var t0  = performance.now();

        if (marker.__animFrame) { cancelAnimationFrame(marker.__animFrame); marker.__animFrame = null; }
        if (marker.__animDone)  { try { marker.__animDone(); } catch (e) {} marker.__animDone = null; }

        var el = marker.getElement && marker.getElement();
        if (el) el.classList.add('moving');

        function step(now) {
          var t = Math.min(1, (now - t0) / dur);
          var e = 1 - Math.pow(1 - t, 3);
          var lat = startLat + (endLat - startLat) * e;
          var lng = startLng + (endLng - startLng) * e;
          marker.setLatLng([lat, lng]);
          if (t < 1) {
            marker.__animFrame = requestAnimationFrame(step);
          } else {
            marker.__animFrame = null;
            marker.__animDone = null;
            var elEnd = marker.getElement && marker.getElement();
            if (elEnd) elEnd.classList.remove('moving');
            if (typeof onDone === 'function') onDone();
          }
        }
        marker.__animDone = onDone;
        marker.__animFrame = requestAnimationFrame(step);
      }

      var myLocBtn  = $('myLocationBtn');

      function showLocInfo(html) {

      function onGeoSuccess(pos) {
        var lat = pos.coords.latitude, lng = pos.coords.longitude, acc = pos.coords.accuracy;
        var ts = new Date(pos.timestamp).toLocaleTimeString('id-ID');
        showLocInfo(
          '<b>Lokasi terdeteksi</b><br>' +
          '<span class="coord">Lat: ' + lat.toFixed(6) + '<br>Lng: ' + lng.toFixed(6) + '</span><br>' +
          'Akurasi: ±' + Math.round(acc) + ' m<br><small>Diperbarui: ' + ts + '</small>'
        );
        if (myLocBtn) { myLocBtn.disabled = false; myLocBtn.innerHTML = 'Perbarui Lokasi'; }
        if (window.map && window.L) {
          if (myMarker) myMarker.setLatLng([lat, lng]);
          else {
            myMarker = L.marker([lat, lng], {
              title: 'Lokasi Saya',
              icon: L.divIcon({
                className: 'my-loc-marker',
                html: '<div style="background:#92C83E;width:18px;height:18px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #92C83E,0 2px 6px rgba(0,0,0,.35);"></div>',
                iconSize: [18, 18], iconAnchor: [9, 9]
              })
            }).addTo(window.map);
            myMarker.bindPopup('<b>Lokasi Saya</b><br>' + lat.toFixed(6) + ', ' + lng.toFixed(6));
          }
          if (myCircle) myCircle.setLatLng([lat, lng]).setRadius(acc);
          else {
            myCircle = L.circle([lat, lng], {
              radius: acc, color: '#92C83E', fillColor: '#92C83E', fillOpacity: 0.12, weight: 1
            }).addTo(window.map);
          }
          window.map.setView([lat, lng], Math.max(window.map.getZoom(), 16));
        }
      }
      function onGeoError(err) {
        var msg = 'Lokasi tidak dapat diambil.';
        switch (err.code) {
          case err.PERMISSION_DENIED: msg = 'Izin lokasi ditolak. Aktifkan izin lokasi di pengaturan browser.'; break;
          case err.POSITION_UNAVAILABLE: msg = 'Informasi lokasi tidak tersedia.'; break;
          case err.TIMEOUT: msg = 'Permintaan lokasi habis waktu. Coba lagi.'; break;
        }
        showLocInfo('<span class="err">' + msg + '</span>');
        if (myLocBtn) { myLocBtn.disabled = false; myLocBtn.innerHTML = 'Lokasi Saya'; }
      }
      function requestMyLocation() {
        if (!('geolocation' in navigator)) {

        if (myLocBtn) { myLocBtn.disabled = true; myLocBtn.innerHTML = 'Mencari…'; }
        navigator.geolocation.getCurrentPosition(

      function getItemCoords(item) {
        if (!item) return null;
        var ds = item.dataset || {};
        var lat = parseFloat(ds.lat), lng = parseFloat(ds.lng);
        if (isNaN(lat) || isNaN(lng)) return null;
        return { lat: lat, lng: lng };
      }
      function getItemName(item) {
        if (!item) return 'Pasien';
        var nm = item.querySelector('strong, b, .name, .item-name');
        if (nm && nm.textContent) return nm.textContent.trim();
        if (item.dataset && item.dataset.name) return item.dataset.name;
        return 'Pasien';
      }
      function getItemNIK(item) {
        if (!item) return '';
        if (item.dataset && item.dataset.nik) return sanitizeNIK(item.dataset.nik);
        var el = item.querySelector('.item-nik .item-nik-value');
        if (el && el.textContent) return sanitizeNIK(el.textContent);
        return '';
      }
      function getItemWA(item) {
        if (!item) return '';
        if (item.dataset && item.dataset.wa) return sanitizeWA(item.dataset.wa);
        var el = item.querySelector('.item-wa .item-wa-value');
        if (el && el.textContent) return sanitizeWA(el.textContent);
        return '';
      }
      function getItemId(item) {
        if (!item) return null;
        var ds = item.dataset || {};
        return ds.id || ds.patientId || ds.patient_id || null;
      }
      function getItemPriority(item) {
        if (!item) return DEFAULT_PRIORITY;
        return normalizePriority(item.dataset && item.dataset.priority);
      }
      function getPatientPayload(item) {
        var id = getItemId(item);
        var live = (id && patientData[id]) ? patientData[id] : null;
        var crd  = getItemCoords(item);

        var nik = getItemNIK(item) || (live ? live.nik : '');

        var waFromLive  = live ? resolvePatientWA(live) : '';
        var waFromDom   = getItemWA(item);
        var waFromJadwal = lookupWAFromJadwalByNIK(nik);

        var wa = waFromLive || waFromDom || waFromJadwal;

        return {
          id: id,
          name: getItemName(item),
          nik: nik,
          wa: wa,
          priority: getItemPriority(item),
          lat: live ? live.lat : (crd ? crd.lat : null),
          lng: live ? live.lng : (crd ? crd.lng : null),
          accuracy: live ? live.accuracy : null,
          speed: live ? live.speed : null,
          heading: live ? live.heading : null,
          ts: live ? live.ts : null
        };
      }

        if (!userMapTarget || !userMapInstance || !userMapMarker) return;

        if (t.accuracy != null && isFinite(t.accuracy) && t.accuracy > 0) {
          if (userMapAccuracy) {
            userMapAccuracy.setLatLng([t.lat, t.lng]).setRadius(t.accuracy);

            var meta = getPriorityMeta(normalizePriority(t.priority));
            userMapAccuracy = L.circle([t.lat, t.lng], {
              radius: t.accuracy, color: meta.color, weight: 1,
              fillColor: meta.color, fillOpacity: 0.12
            }).addTo(userMapInstance);
          }
        }

        var last = userMapTrackPts[userMapTrackPts.length - 1];
        if (!last || haversineMeters(last[0], last[1], t.lat, t.lng) > 15) {
          userMapTrackPts.push([t.lat, t.lng]);
          if (userMapTrackPts.length > 500) userMapTrackPts.shift();
          if (userMapTrack) {
            userMapTrack.setLatLngs(userMapTrackPts);
          } else if (userMapTrackPts.length > 1) {
            var meta2 = getPriorityMeta(normalizePriority(t.priority));

              color: meta2.color, weight: 4, opacity: 0.75,
              dashArray: '1 8', lineCap: 'round'
            }).addTo(userMapInstance);
          }

        if (userMapFollow) {
          try { userMapInstance.panTo([t.lat, t.lng], { animate: true, duration: 0.5 }); } catch (e) {}
        }

        renderUserMapMeta();

        if (userMapWA && userMapTarget) {

        userMapFollowBtn.addEventListener('click', function () {
          userMapFollow = !userMapFollow;
          userMapFollowBtn.textContent = userMapFollow ? 'Follow: ON' : 'Follow: OFF';
          userMapFollowBtn.style.color = userMapFollow ? '#1B5FAA' : '#888';
        });
        var canvasWrap = userMapCanvas.parentNode;
        if (canvasWrap) {
          if (getComputedStyle(canvasWrap).position === 'static') {
            canvasWrap.style.position = 'relative';
          }
          canvasWrap.appendChild(userMapFollowBtn);
        }
      }

      function openUserMap(item) {
        if (!item || !window.L || !userMapOverlay) return;

        var crd = getItemCoords(item);
        if (!crd) { alert('Lokasi pasien ini belum tersedia.'); return; }

        var id = getItemId(item);
        var live = (id && patientData[id]) ? patientData[id] : null;

        var name = getItemName(item);
        var nik  = getItemNIK(item) || (live ? live.nik : '');
        var waDom = getItemWA(item);
        var waLive = live ? resolvePatientWA(live) : '';
        var waJadwal = lookupWAFromJadwalByNIK(nik);
        var wa    = waLive || waDom || waJadwal;
        var prio = getItemPriority(item);
        var acc  = live ? live.accuracy : null;
        var ts   = live ? live.ts : null;
        var speed = live ? live.speed : null;
        var heading = live ? live.heading : null;
        var meta = getPriorityMeta(prio);

        userMapTarget = {
          id: id, name: name, nik: nik, wa: wa, priority: prio,
          lat: crd.lat, lng: crd.lng, accuracy: acc, ts: ts,
          speed: speed, heading: heading
        };
        userMapFollow = true;

        userMapTitle.textContent = name || 'Pasien';
        var subParts = [];
        if (nik) subParts.push('NIK ' + nik);
        subParts.push(meta.label);
        userMapSubtitle.innerHTML =
          escapeHtml(subParts[0] || '') +
          (subParts[1] ? '<span class="uma-tag">' + escapeHtml(subParts[1]) + '</span>' : '');

        renderUserMapMeta();

        if (userMapGmaps) {
          userMapGmaps.setAttribute('href',
            'https://www.google.com/maps/dir/?api=1&destination=' +
            encodeURIComponent(crd.lat + ',' + crd.lng));
        }

        if (userMapWA) {
          userMapWA.setAttribute('href',
            buildWALink(userMapTarget, { toPatient: true }));
        }
        if (userMapWAAdmin) {
          userMapWAAdmin.setAttribute('href',
            buildWALink(userMapTarget, { toAdmin: true }));
        }

        userMapOverlay.classList.add('show');
        lockBody();
        destroyUserMap();

        setTimeout(function () {
          var tileCfg = window.__TILE_CFG__ || {
            url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            attribution: '&copy; OpenStreetMap'
          };

          userMapInstance = L.map(userMapCanvas, {
            zoomControl: true, attributionControl: true, preferCanvas: true
          }).setView([crd.lat, crd.lng], 17);

          L.tileLayer(tileCfg.url, {
            maxZoom: tileCfg.maxZoom || 20,
            attribution: tileCfg.attribution
          }).addTo(userMapInstance);

          userMapMarker = L.marker([crd.lat, crd.lng], {
            icon: makeUserMapPin(prio, heading),
            title: name
          }).addTo(userMapInstance);
          userMapMarker.bindPopup(
            '<div style="min-width:180px;">' +
              '<b>' + escapeHtml(name || 'Pasien') + '</b>' +
              (nik ? '<br><span style="font-size:11px;color:#1B5FAA;font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace;">NIK ' + escapeHtml(nik) + '</span>' : '') +
              (wa ? '<br><span style="font-size:11px;color:#25D366;font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace;">WA ' + escapeHtml(wa) + '</span>' : '') +
              '<br><span style="font-size:11px;color:#555;">Kelas: <b>' + escapeHtml(meta.label) + '</b></span>' +
            '</div>'
          ).openPopup();

          userMapTrackPts = [[crd.lat, crd.lng]];

          if (acc != null && isFinite(acc) && acc > 0) {
            userMapAccuracy = L.circle([crd.lat, crd.lng], {
              radius: acc, color: meta.color, weight: 1,
              fillColor: meta.color, fillOpacity: 0.12
            }).addTo(userMapInstance);
          }

          if (HOSPITAL_COORD) {
            L.marker([HOSPITAL_COORD.lat, HOSPITAL_COORD.lng], {
              icon: L.divIcon({
                className: '',
                html: '<div class="pin hosp">+</div>',
                iconSize: [30, 30], iconAnchor: [15, 15]
              })
            }).addTo(userMapInstance).bindTooltip(HOSPITAL_COORD.name);

            L.polyline(
              [[crd.lat, crd.lng], [HOSPITAL_COORD.lat, HOSPITAL_COORD.lng]],
              { color: '#1B5FAA', weight: 2, opacity: 0.45, dashArray: '5 8' }
            ).addTo(userMapInstance);
          }

          ensureFollowBtn();
          if (userMapFollowBtn) {
            userMapFollowBtn.textContent = 'Follow: ON';
            userMapFollowBtn.style.color = '#1B5FAA';
          }

          setTimeout(function () { try { userMapInstance.invalidateSize(); } catch (e) {} }, 60);
          setTimeout(function () { try { userMapInstance.invalidateSize(); } catch (e) {} }, 320);
        }, 30);
      }

      function closeUserMap() {
        if (!userMapOverlay) return;
        userMapOverlay.classList.remove('show');
        unlockBody();
        setTimeout(destroyUserMap, 220);
        userMapTarget = null;
        if (userMapFollowBtn) { try { userMapFollowBtn.remove(); } catch (e) {} userMapFollowBtn = null; }
      }

      if (userMapCloseBtn) userMapCloseBtn.addEventListener('click', closeUserMap);
      if (userMapOverlay) userMapOverlay.addEventListener('click', function (e) {
        if (e.target === userMapOverlay) closeUserMap();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && userMapOverlay && userMapOverlay.classList.contains('show')) {
          closeUserMap();
        }
      });
      if (userMapFocusMain) {
        userMapFocusMain.addEventListener('click', function () {
          var t = userMapTarget;
          closeUserMap();
          if (!t) return;
          setTimeout(function () {
            if (window.map && typeof window.map.flyTo === 'function') {
              window.map.flyTo([t.lat, t.lng], 17, { duration: 1.2 });
            }
            var m = window.patientMarkers && window.patientMarkers[t.id];
            if (m && typeof m.openPopup === 'function') {
              setTimeout(function () { try { m.openPopup(); } catch (e) {} }, 1300);
            }
          }, 260);
        });
      }
      window.addEventListener('resize', function () {
        if (userMapInstance) { try { userMapInstance.invalidateSize(); } catch (e) {} }
      });

      /* =========================================================
         11. KLIK PASIEN → BUKA MODAL PETA PER-USER (+ WA)
         ========================================================= */
      listEl.addEventListener('click', function (e) {
        var waBtn = e.target.closest
          ? e.target.closest('.wa-btn, [data-action="wa"]')
          : null;
        if (waBtn) {
          e.preventDefault();
          e.stopPropagation();
          var waLi = waBtn.closest ? waBtn.closest('.item') : null;
          if (waLi) {
            refreshJadwalCacheIfChanged();

            var payload = getPatientPayload(waLi);
            var waUrl = buildWALink(payload, { toPatient: true });
            window.open(waUrl, '_blank', 'noopener');
          }
          return;
        }

        var node = e.target;
        while (node && node !== listEl) {
          if (node.classList && node.classList.contains('item')) break;
          node = node.parentNode;
        }
        if (!node || node === listEl) return;
        openUserMap(node);
      });

      /* =========================================================
         12. TERIMA KOORDINAT PASIEN REALTIME (peta utama)
         ========================================================= */
      window.patientMarkers = window.patientMarkers || {};
      var patientData = {};

      function makePatientIcon(priority) {
        var norm = normalizePriority(priority);
        var meta = getPriorityMeta(norm);
        return L.divIcon({
          className: 'pin ' + meta.cls,
          html: '<div class="pin ' + meta.cls + '" ' +
                'style="background:' + meta.color + ';">' +
                '<span class="pulse"></span></div>',
          iconSize: [26, 26],
          iconAnchor: [13, 13],
          popupAnchor: [0, -12]
        });
      }

      function makePatientPopupHTML(data) {
        var safeName = escapeHtml(data.name || 'Pasien');
        var nik = data.nik ? sanitizeNIK(data.nik) : '';
        var wa  = pickPatientWA(data);
        var lat = Number(data.lat).toFixed(6);
        var lng = Number(data.lng).toFixed(6);
        var acc = data.accuracy != null ? '±' + Math.round(data.accuracy) + ' m' : '-';
        var prioLabel = getPriorityMeta(normalizePriority(data.priority)).label;
        var when = '';
        if (data.ts) { try { when = new Date(data.ts).toLocaleTimeString('id-ID'); } catch (e) {} }
        return '<div style="min-width:200px;">' +
               '<b>' + safeName + '</b>' +
               (nik ? '<br><span style="font-size:11px;color:#1B5FAA;font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace;">NIK ' + nik + '</span>' : '') +
               (wa ? '<br><span style="font-size:11px;color:#25D366;font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace;">WA ' + escapeHtml(wa) + '</span>' : '') +
               '<br><span style="font-size:11px;color:#555;">' +
                 'Kelas: <b>' + prioLabel + '</b><br>' +
                 'Lat ' + lat + ', Lng ' + lng + '<br>' +
                 'Akurasi ' + acc +
                 (when ? '<br>Update: ' + when : '') +
               '</span>' +
               '</div>';
      }

      function upsertPatientMarker(data) {
        if (!data || data.lat == null || data.lng == null) return;

        var id = data.id || (data.name || '').toLowerCase().replace(/\s+/g, '-');
        if (!id) return;

        var lat = Number(data.lat);
        var lng = Number(data.lng);
        if (isNaN(lat) || isNaN(lng)) return;

        var prio = normalizePriority(data.priority);
        var nik  = sanitizeNIK(data.nik || '');

        var waDirect = sanitizeWA(
          data.wa != null ? data.wa
          : data.phone != null ? data.phone
          : data.hp != null ? data.hp
          : ''
        );
        var waFromJadwal = lookupWAFromJadwalByNIK(nik);
        var wa = waDirect || waFromJadwal;

        patientData[id] = {
          id: id,
          name: data.name || 'Pasien',
          nik: nik,
          wa: wa,
          priority: prio,
          lat: lat,
          lng: lng,
          accuracy: data.accuracy != null ? Number(data.accuracy) : null,
          heading: (data.heading != null && isFinite(Number(data.heading))) ? Number(data.heading) : null,
          speed:   (data.speed   != null && isFinite(Number(data.speed)))   ? Number(data.speed)   : null,
          ts: data.ts || Date.now()
        };

        if (!window.map || !window.L) return;

        var marker = window.patientMarkers[id];
        var icon   = makePatientIcon(prio);
        var popup  = makePatientPopupHTML(patientData[id]);

        if (!marker) {
          marker = L.marker([lat, lng], {
            icon: icon,
            title: patientData[id].name,
            riseOnHover: true
          }).addTo(window.map);
          marker.bindPopup(popup);
          window.patientMarkers[id] = marker;
        } else {
          var wasOpen = (typeof marker.isPopupOpen === 'function') && marker.isPopupOpen();
          marker.setIcon(icon);
          marker.setPopupContent(popup);
          var from = marker.getLatLng();
          var farAway = Math.hypot(lat - from.lat, lng - from.lng) > 0.002;
          var dur = farAway ? 1500 : 900;
          animateMarkerTo(marker, lat, lng, dur, function () {
            if (wasOpen) { try { marker.openPopup(); } catch (e) {} }
          });
        }

        upsertPatientListItem(patientData[id]);

        if (userMapTarget && userMapTarget.id === id) {
          userMapTarget.lat = lat;
          userMapTarget.lng = lng;
          userMapTarget.accuracy = patientData[id].accuracy;
          userMapTarget.heading = patientData[id].heading;
          userMapTarget.speed   = patientData[id].speed;
          userMapTarget.ts      = patientData[id].ts;
          userMapTarget.priority = prio;
          userMapTarget.wa      = patientData[id].wa;
          updateUserMapLive();
        }
      }

      /* =========================================================
         13. ITEM LIST — HANYA tombol WhatsApp
         ========================================================= */
      function upsertPatientListItem(data) {
        var id = data.id;
        var item = listEl.querySelector('[data-id="' + id + '"]');

        var prio = normalizePriority(data.priority);
        var meta = getPriorityMeta(prio);
        var label = meta.label;
        var nik = sanitizeNIK(data.nik || '');

        var waDirect = sanitizeWA(data.wa || '');
        var waJadwal = lookupWAFromJadwalByNIK(nik);
        var wa = waDirect || waJadwal;

        if (!item) {
          item = document.createElement('li');
          item.className = 'item ' + meta.cls + ' is-clickable';
          item.dataset.id = id;
          item.dataset.name = data.name;
          item.dataset.nik = nik;
          item.dataset.wa  = wa;
          item.dataset.priority = prio;
          item.dataset.lat = data.lat;
          item.dataset.lng = data.lng;

          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'item-btn';

          var top = document.createElement('div');
          top.className = 'item-top';

          var nameWrap = document.createElement('div');
          var nameEl = document.createElement('strong');
          nameEl.textContent = data.name;
          nameWrap.appendChild(nameEl);

          if (nik) {
            var nikEl = document.createElement('div');
            nikEl.className = 'item-nik';
            var nikLbl = document.createElement('span');
            nikLbl.className = 'item-nik-label';
            nikLbl.textContent = 'NIK';
            var nikVal = document.createElement('span');
            nikVal.className = 'item-nik-value';
            nikVal.textContent = nik;
            nikEl.appendChild(nikLbl);
            nikEl.appendChild(nikVal);
            nameWrap.appendChild(nikEl);
          }

          if (wa) {
            var waEl = document.createElement('div');
            waEl.className = 'item-wa';
            var waLbl = document.createElement('span');
            waLbl.className = 'item-wa-label';
            waLbl.textContent = 'WA';
            var waVal = document.createElement('span');
            waVal.className = 'item-wa-value';
            waVal.textContent = wa;
            waEl.appendChild(waLbl);
            waEl.appendChild(waVal);
            nameWrap.appendChild(waEl);
          }

          var nameMeta = document.createElement('div');
          nameMeta.className = 'item-meta';
          nameMeta.textContent = 'Lat ' + Number(data.lat).toFixed(5) +
                                 ', Lng ' + Number(data.lng).toFixed(5);
          nameWrap.appendChild(nameMeta);

          var actions = document.createElement('div');
          actions.className = 'item-actions';

          var waBtn = document.createElement('button');
          waBtn.type = 'button';
          waBtn.className = 'wa-btn';
          waBtn.setAttribute('data-action', 'wa');
          waBtn.setAttribute('aria-label', 'Kirim WhatsApp ke ' + data.name);
          waBtn.title = hasPatientWA(data)
            ? 'Kirim WhatsApp langsung ke pasien (template pesan otomatis)'
            : 'Pasien belum punya nomor WA — akan dikirim ke admin RS';
          waBtn.textContent = 'WhatsApp';
          actions.appendChild(waBtn);

          top.appendChild(nameWrap);
          top.appendChild(actions);
          btn.appendChild(top);
          item.appendChild(btn);
          listEl.appendChild(item);
        } else {
          item.dataset.lat = data.lat;
          item.dataset.lng = data.lng;
          item.dataset.priority = prio;
          item.dataset.nik = nik;
          item.dataset.wa  = wa;

          var existingNik = item.querySelector('.item-nik');
          if (nik) {
            if (existingNik) {
              var valEl = existingNik.querySelector('.item-nik-value');
              if (valEl) valEl.textContent = nik;
            } else {
              var nameWrap2 = item.querySelector('.item-top > div:first-child');
              if (nameWrap2) {
                var newNik = document.createElement('div');
                newNik.className = 'item-nik';
                var nlb = document.createElement('span');
                nlb.className = 'item-nik-label';
                nlb.textContent = 'NIK';
                var nvl = document.createElement('span');
                nvl.className = 'item-nik-value';
                nvl.textContent = nik;
                newNik.appendChild(nlb);
                newNik.appendChild(nvl);
                var metaNode = nameWrap2.querySelector('.item-meta');
                if (metaNode) nameWrap2.insertBefore(newNik, metaNode);
                else nameWrap2.appendChild(newNik);
              }
            }
          } else if (existingNik && existingNik.parentNode) {
            existingNik.parentNode.removeChild(existingNik);
          }

          var existingWa = item.querySelector('.item-wa');
          if (wa) {
            if (existingWa) {
              var waValEl = existingWa.querySelector('.item-wa-value');
              if (waValEl) waValEl.textContent = wa;
            } else {
              var nameWrap3 = item.querySelector('.item-top > div:first-child');
              if (nameWrap3) {
                var newWa = document.createElement('div');
                newWa.className = 'item-wa';
                var wlb = document.createElement('span');
                wlb.className = 'item-wa-label';
                wlb.textContent = 'WA';
                var wvl = document.createElement('span');
                wvl.className = 'item-wa-value';
                wvl.textContent = wa;
                newWa.appendChild(wlb);
                newWa.appendChild(wvl);
                var metaNode2 = nameWrap3.querySelector('.item-meta');
                if (metaNode2) nameWrap3.insertBefore(newWa, metaNode2);
                else nameWrap3.appendChild(newWa);
              }
            }
          } else if (existingWa && existingWa.parentNode) {
            existingWa.parentNode.removeChild(existingWa);
          }

          var metaEl = item.querySelector('.item-meta');
          if (metaEl) {
            metaEl.textContent = 'Lat ' + Number(data.lat).toFixed(5) +
                                 ', Lng ' + Number(data.lng).toFixed(5);
          }
          var tagEl = item.querySelector('.tag');
          if (tagEl) {
            tagEl.className = 'tag ' + meta.cls;
            tagEl.textContent = label;
          }
          var wasActive = item.classList.contains('active');
          item.className = 'item ' + meta.cls + ' is-clickable' + (wasActive ? ' active' : '');
        }

        if (window.patientMarkers[id]) {
          item.__marker = window.patientMarkers[id];
        }

        var summaryEl = $('summary');
        if (summaryEl) {
          var total = listEl.querySelectorAll('.item').length;
          summaryEl.textContent = total
            ? total + ' pasien membagikan lokasi.'
            : 'Belum ada pasien yang membagikan lokasi.';
        }
        updateLiveTag();
      }

      function removePatient(data) {
        if (!data || !data.id) return;
        var id = data.id;
        var marker = window.patientMarkers[id];
        if (marker && window.map && typeof window.map.removeLayer === 'function') {
          try {
            if (marker.__animFrame) cancelAnimationFrame(marker.__animFrame);
            if (marker.__animDone) marker.__animDone = null;
            window.map.removeLayer(marker);
          } catch (e) {}
        }
        delete window.patientMarkers[id];
        delete patientData[id];

        var item = listEl.querySelector('[data-id="' + id + '"]');
        if (item && item.parentNode) item.parentNode.removeChild(item);

        var summaryEl = $('summary');
        if (summaryEl) {
          var total = listEl.querySelectorAll('.item').length;
          summaryEl.textContent = total
            ? total + ' pasien membagikan lokasi.'
            : 'Belum ada pasien yang membagikan lokasi.';
        }
        updateLiveTag();
      }

      function persistRemoval(id) {
        try {
          var raw = localStorage.getItem(LS_LIVE_KEY);
          if (!raw) return;
          var arr = JSON.parse(raw);
          if (!Array.isArray(arr)) return;
          var filtered = arr.filter(function (p) {
            if (!p) return false;
            var pid = p.id != null ? p.id : (p.name || '').toLowerCase().replace(/\s+/g, '-');
            return String(pid) !== String(id);
          });
          var json = JSON.stringify(filtered);
          localStorage.setItem(LS_LIVE_KEY, json);
          lastSnapshot = json;
        } catch (e) {
          console.warn('persistRemoval error:', e);
        }
      }

      function updatePatientInfo(data) {
        if (!data || !data.id) return;
        var existing = patientData[data.id];
        if (!existing) return;
        existing.name = data.name || existing.name;
        if (data.nik != null) existing.nik = sanitizeNIK(data.nik);
        if (data.wa != null || data.phone != null || data.hp != null) {
          existing.wa = sanitizeWA(
            data.wa != null ? data.wa
            : data.phone != null ? data.phone
            : data.hp
          );
        }
        if (data.priority) existing.priority = normalizePriority(data.priority);

        var marker = window.patientMarkers[data.id];
        if (marker) {
          marker.setIcon(makePatientIcon(existing.priority));
          marker.setPopupContent(makePatientPopupHTML(existing));
        }
        upsertPatientListItem(existing);

        if (userMapTarget && userMapTarget.id === data.id) {
          userMapTarget.name = existing.name;
          userMapTarget.nik = existing.nik;
          userMapTarget.wa = existing.wa;
          userMapTarget.priority = existing.priority;
          userMapTitle.textContent = existing.name || 'Pasien';
          var prioMeta = getPriorityMeta(existing.priority);
          var sub2 = [];
          if (existing.nik) sub2.push('NIK ' + existing.nik);
          sub2.push(prioMeta.label);
          userMapSubtitle.innerHTML =
            escapeHtml(sub2[0] || '') +
            (sub2[1] ? '<span class="uma-tag">' + escapeHtml(sub2[1]) + '</span>' : '');
          if (userMapWA) {
            userMapWA.setAttribute('href',
              buildWALink(userMapTarget, { toPatient: true }));
          }
          if (userMapWAAdmin) {
            userMapWAAdmin.setAttribute('href',
              buildWALink(userMapTarget, { toAdmin: true }));
          }
        }
      }

      function updateLiveTag() {
        var tag = $('liveTag');
        if (!tag) return;
        var total = listEl.querySelectorAll('.item').length;
        tag.textContent = total ? '● LIVE · ' + total : '● LIVE';
        if (typeof updateClearHistoryBtn === 'function') {
          updateClearHistoryBtn();
        }
      }

      /* =========================================================
         14. TRANSPORT
         ========================================================= */
      var rxTransport = null;
      if (typeof createTransport === 'function') {
        try {
          rxTransport = createTransport(
            function (msg) {
              if (!msg || typeof msg !== 'object') return;
              switch (msg.type) {
                case 'location':      upsertPatientMarker(msg); break;
                case 'patient-info':  updatePatientInfo(msg);   break;
                case 'location-stop': removePatient(msg);       break;
              }
            },
            function (state) {
              var connEl = $('connStatus');
              if (connEl) {
                if (state === 'demo') {
                  connEl.style.display = 'none';
                  connEl.textContent = '';
                  connEl.className = 'conn';
                  return;
                }
                connEl.style.display = '';
                var map = { online: 'Terhubung', offline: 'Terputus', unsupported: 'Tidak didukung' };
                connEl.textContent = map[state] || state || '';
                connEl.className = 'conn ' + state;
              }
            }
          );
        } catch (e) {
          console.warn('createTransport gagal:', e);
        }
      }

      /* =========================================================
         15. FALLBACK localStorage
         ========================================================= */
      var LS_LIVE_KEY = 'pasien_lokasi_live';
      var lastSnapshot = '';

      function loadFromLocalStorage(force) {
        try {
          var raw = localStorage.getItem(LS_LIVE_KEY);
          if (!raw) {
            if (force) {
              var items = listEl.querySelectorAll('.item');
              for (var k = 0; k < items.length; k++) {
                var iid = items[k].dataset.id;
                if (window.patientMarkers[iid] && window.map) {
                  try { window.map.removeLayer(window.patientMarkers[iid]); } catch (e) {}
                }
                delete window.patientMarkers[iid];
                delete patientData[iid];
                items[k].parentNode.removeChild(items[k]);
              }
              updateLiveTag();
            }
            return;
          }
          if (!force && raw === lastSnapshot) return;
          lastSnapshot = raw;

          var arr = JSON.parse(raw);
          if (!Array.isArray(arr)) return;

          var activeIds = {};
          arr.forEach(function (p) {
            if (p && p.lat != null && p.lng != null) {
              p.priority = normalizePriority(p.priority);
              p.nik = sanitizeNIK(p.nik || '');
              p.wa  = sanitizeWA(
                p.wa != null ? p.wa
                : p.phone != null ? p.phone
                : p.hp != null ? p.hp
                : ''
              );
              activeIds[p.id] = true;
              upsertPatientMarker(p);
            }
          });

          Object.keys(patientData).forEach(function (pid) {
            if (!activeIds[pid]) removePatient({ id: pid });
          });
        } catch (e) {
          console.warn('loadFromLocalStorage error:', e);
        }
      }

      loadFromLocalStorage(true);

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
          loadFromLocalStorage(true);
        }, { once: true });
      }
      window.addEventListener('load', function () { loadFromLocalStorage(true); });
      window.addEventListener('storage', function (e) {
        if (e.key === LS_LIVE_KEY) {
          lastSnapshot = '';
          loadFromLocalStorage(true);
        }
        if (e.key === JADWAL_STORAGE_KEY) {
          refreshJadwalCacheIfChanged();
          syncAllPatientWAB();
        }
      });
      setInterval(function () { loadFromLocalStorage(false); }, 2000);

      setInterval(function () {
        if (refreshJadwalCacheIfChanged()) {
          syncAllPatientWAB();
        }
      }, 3000);

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          lastSnapshot = '';
          if (refreshJadwalCacheIfChanged()) {
            syncAllPatientWAB();
          }
          loadFromLocalStorage(true);
        }
      });

      rebuildJadwalCache();

      /* =========================================================
         16. TOMBOL HAPUS RIWAYAT (GLOBAL)
         ========================================================= */
      function updateClearHistoryBtn() {
        var btn = $('clearHistoryBtn');
        if (!btn) return;
        var total = listEl.querySelectorAll('.item').length;
        btn.disabled = (total === 0);
        btn.setAttribute('aria-disabled', total === 0 ? 'true' : 'false');
        btn.title = total
          ? 'Hapus ' + total + ' riwayat pasien prioritas'
          : 'Tidak ada riwayat untuk dihapus';
      }

      function clearAllHistory() {
        var total = listEl.querySelectorAll('.item').length;
        if (!total) { updateClearHistoryBtn(); return; }

        if (typeof window.confirm === 'function') {
          var ok = window.confirm(
            'Hapus semua riwayat Pasien Prioritas?\n\n' +
            total + ' data pasien akan dihapus dari daftar dan ' +
            'penyimpanan lokal. Tindakan ini tidak dapat dibatalkan.'
          );
          if (!ok) return;
        }

        Object.keys(window.patientMarkers || {}).forEach(function (id) {
          var marker = window.patientMarkers[id];
          if (marker && window.map && typeof window.map.removeLayer === 'function') {
            try {
              if (marker.__animFrame) cancelAnimationFrame(marker.__animFrame);
              if (marker.__animDone) marker.__animDone = null;
              window.map.removeLayer(marker);
            } catch (e) {}
          }
          delete window.patientMarkers[id];
          delete patientData[id];
        });

        while (listEl.firstChild) listEl.removeChild(listEl.firstChild);
        try { localStorage.removeItem(LS_LIVE_KEY); } catch (e) {}
        lastSnapshot = '';

        var summaryEl = $('summary');
        if (summaryEl) summaryEl.textContent = 'Belum ada pasien yang membagikan lokasi.';
        var t = $('locText1');
        if (t) t.innerHTML = 'Lokasi Pasien<small>Menunggu data…</small>';
        var icon = $('locIcon1');
        if (icon) icon.className = 'loc-icon green';

        updateLiveTag();
        updateClearHistoryBtn();
        syncSheet();
        fixMap(80);

        if (userMapOverlay && userMapOverlay.classList.contains('show')) {
          closeUserMap();
        }

        try { console.info('[riwayat] Semua riwayat pasien prioritas dihapus.'); } catch (e) {}
      }

      var clearHistoryBtn = $('clearHistoryBtn');
      if (clearHistoryBtn) {
        clearHistoryBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          clearAllHistory();
        });
      }

      updateLiveTag();

      /* =========================================================
         17. API PUBLIK
         ========================================================= */
      window.__dashboard = {
        upsert: upsertPatientMarker,
        remove: removePatient,
        updateInfo: updatePatientInfo,
        reload: function () { lastSnapshot = ''; loadFromLocalStorage(true); },
        normalizePriority: normalizePriority,
        sanitizeNIK: sanitizeNIK,
        sanitizeWA: sanitizeWA,
        normalizeWA: normalizeWA,
        pickPatientWA: pickPatientWA,
        hasPatientWA: hasPatientWA,
        buildWALink: buildWALink,
        waConfig: WA_CONFIG,

        lookupWAFromJadwalByNIK: lookupWAFromJadwalByNIK,
        lookupJadwalByNIK: lookupJadwalByNIK,
        refreshJadwalCacheIfChanged: refreshJadwalCacheIfChanged,
        syncAllPatientWAB: syncAllPatientWAB,
        JADWAL_STORAGE_KEY: JADWAL_STORAGE_KEY,

        markers: window.patientMarkers,
        data: patientData,
        hospital: HOSPITAL_COORD,
        transport: function () { return rxTransport; },
        lockBody: lockBody,
        unlockBody: unlockBody,
        syncSheet: syncSheet,
        fixMap: fixMap,
        animateMarkerTo: animateMarkerTo,
        openUserMap: openUserMap,
        closeUserMap: closeUserMap,
        clearAllHistory: clearAllHistory,
        persistRemoval: persistRemoval
      };
    })();
  </script>

  <!-- =================================================================
       LOADER JADWAL BEROBAT
       ================================================================= -->
  <script>
    (function () {
      'use strict';

      if (window.__JADWAL_LOADER_INIT__) return;
      window.__JADWAL_LOADER_INIT__ = true;

      var JADWAL_SOURCES = [
        'jadwal_berobat.html',
        '../jadwal_berobat.html',
        'jadwal_berobat.php'
      ];

      function fetchFirstAvailable(sources, index) {
        if (index >= sources.length) {
          return Promise.reject(new Error('Semua path gagal: ' + sources.join(', ')));
        }
        var url = sources[index];
        return fetch(url, { cache: 'no-cache' })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text().then(function (txt) {
              if (/^\s*<\?php/i.test(txt)) {
                throw new Error('Bukan HTML (PHP source mentah)');
              }
              return { url: url, html: txt };
            });
          })
          .catch(function (err) {
            console.warn('[jadwal_berobat] Gagal coba "' + url + '": ' + err.message);
            return fetchFirstAvailable(sources, index + 1);
          });
      }

      function injectMarkup(parsedDoc) {
        var injected = { section: false, modal: false, scripts: 0 };

        var section = parsedDoc.querySelector('.schedule-section');
        var sidePanel = document.getElementById('sidePanel');
        if (section && sidePanel) {
          sidePanel.appendChild(section);
          injected.section = true;
        }

        var modal = parsedDoc.querySelector('#scheduleModal')
                 || parsedDoc.querySelector('.modal-overlay');
        if (modal) {
          if (!document.getElementById(modal.id || 'scheduleModal')) {
            document.body.appendChild(modal);
            injected.modal = true;
          }
        }

        var scripts = parsedDoc.querySelectorAll('script');
        scripts.forEach(function (old) {
          if (old.src) {
            var se = document.createElement('script');
            se.src = old.src;
            if (old.async) se.async = true;
            if (old.defer) se.defer = true;
            document.body.appendChild(se);
            return;
          }
          var inline = document.createElement('script');
          if (old.type) inline.type = old.type;
          inline.textContent = old.textContent;
          document.body.appendChild(inline);
          injected.scripts++;
        });

        return injected;
      }

      function loadJadwalBerobat() {
        fetchFirstAvailable(JADWAL_SOURCES, 0)
          .then(function (result) {
            var parsed = new DOMParser().parseFromString(result.html, 'text/html');
            var info = injectMarkup(parsed);

            console.info(
              '[jadwal_berobat] Loaded from "' + result.url + '" — ' +
              'section=' + info.section +
              ', modal=' + info.modal +
              ', inline-scripts=' + info.scripts
            );

            setTimeout(function () {
              if (window.__dashboard && typeof window.__dashboard.syncSheet === 'function') {
                try { window.__dashboard.syncSheet(); } catch (e) {}
              }
              if (window.__dashboard && typeof window.__dashboard.fixMap === 'function') {
                try { window.__dashboard.fixMap(80); } catch (e) {}
              }
              if (window.__dashboard && typeof window.__dashboard.refreshJadwalCacheIfChanged === 'function') {
                try {
                  window.__dashboard.refreshJadwalCacheIfChanged();
                  window.__dashboard.syncAllPatientWAB();
                } catch (e) {}
              }
            }, 150);
          })
          .catch(function (err) {
            console.error('[jadwal_berobat] GAGAL memuat modul:', err.message);
          });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadJadwalBerobat, { once: true });
      } else {
        setTimeout(loadJadwalBerobat, 0);
      }
    })();
  </script>
